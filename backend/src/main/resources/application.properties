spring.application.name=study-buddy

# --- Disable default in-memory user in dev (removes generated password banner) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Datasource (fill in your local Postgres details) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Web & CORS (open for dev) ---
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# --- Spring AI Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL}

# --- File uploads & OCR (optional) ---
# Directory where uploaded files are stored (relative to project root by default)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
# Path to the Tesseract installation directory (parent of tessdata)
app.tesseract.datapath=${TESSERACT_DATAPATH:}
# Language for OCR. For multiple: eng+spa
app.tesseract.lang=${TESSERACT_LANG:eng}
