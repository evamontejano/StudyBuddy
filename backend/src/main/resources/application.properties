spring.application.name=study-buddy

# Elastic Beanstalk reverse proxy compatibility
server.port=${SERVER_PORT:8080}

# --- Disable default in-memory user in dev (removes generated password banner) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Datasource (fill in your local Postgres details) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studybuddy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA & Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Web & CORS (open for dev) ---
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# --- Spring AI Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:llama3:8b}

# --- Extra CORS origins (comma-separated, added via CORS_EXTRA_ORIGINS env var on EB) ---
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:}

# --- Amazon Bedrock (used when Ollama is unavailable, e.g. on AWS) ---
# Set BEDROCK_ENABLED=true in Elastic Beanstalk environment variables
app.bedrock.enabled=${BEDROCK_ENABLED:false}
app.bedrock.region=${BEDROCK_REGION:us-east-1}
app.bedrock.model-id=${BEDROCK_MODEL_ID:amazon.nova-micro-v1:0}

# --- File uploads & OCR (optional) ---
# Directory where uploaded files are stored (relative to project root by default)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
# Path to the Tesseract installation directory (parent of tessdata)
app.tesseract.datapath=${TESSERACT_DATAPATH:}
# Language for OCR. For multiple: eng+spa
app.tesseract.lang=${TESSERACT_LANG:eng}
