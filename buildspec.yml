version: 0.2
# AWS CodeBuild specification
# Builds a Docker image from the backend and pushes it to Amazon ECR.
# Required environment variables (set in CodeBuild project):
#   ECR_REPOSITORY_URI  - e.g. 961776041326.dkr.ecr.eu-central-1.amazonaws.com/studybuddy-backend
#   AWS_DEFAULT_REGION  - e.g. eu-central-1

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo Image tag is $IMAGE_TAG

  build:
    commands:
      - echo Build started at $(date)
      - echo Building Docker image...
      - docker build -t studybuddy-backend ./backend
      - docker tag studybuddy-backend:latest $ECR_REPOSITORY_URI:latest
      - docker tag studybuddy-backend:latest $ECR_REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push $ECR_REPOSITORY_URI:latest
      - docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
      - echo Build and push completed at $(date)
